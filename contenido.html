<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Contenido — ExamRobotic</title>
    <link rel="icon" href="assets/img/images/logo/logorobot.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/tailwind-config.js"></script>
    <script src="assets/js/theme.js"></script>
    <link rel="stylesheet" href="assets/css/menu.css">
    <link rel="stylesheet" href="assets/css/content.css">
    <script src="assets/js/content-data.js"></script>
</head>
<body>

<header class="app-header">
    <div class="header-inner">
        <a href="index.html" class="brand">
            <div class="brand-mark">
                <img src="assets/img/images/logo/logorobot.svg" alt="ExamRobotic">
            </div>
            <div>
                <div class="brand-title">Exam<span class="dot">·</span>robotic</div>
                <div class="brand-sub">GS · Robótica y Automatización</div>
            </div>
        </a>
        <nav class="header-nav">
            <a href="index.html" class="nav-link">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
                Asignaturas
            </a>
            <a href="test-libre.html" class="nav-link">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>
                Test libre
            </a>
            <a href="estadisticas.html" class="nav-link">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 3 5-6"/></svg>
                Mi progreso
            </a>
        </nav>
        <div style="display:flex;align-items:center;gap:8px;">
            <button class="icon-btn" data-theme-toggle onclick="toggleTheme()" title="Cambiar tema (T)" aria-label="Cambiar tema"></button>
        </div>
    </div>
</header>

    <main class="page" style="max-width:1200px;margin:0 auto;padding:32px 20px 80px;">

        <!-- Breadcrumb -->
        <nav class="breadcrumb-bar" aria-label="Navegación">
            <button class="back-btn" onclick="window.location.href='index.html'">← Volver</button>
            <span class="breadcrumb-sep">/</span>
            <span id="breadcrumb-subject" class="breadcrumb-current">Asignatura</span>
        </nav>

        <!-- Subject header -->
        <div class="mb-6">
            <h2 id="subject-title" class="text-2xl md:text-3xl font-extrabold tracking-tight text-foreground mb-1">Contenido</h2>
            <p class="text-muted text-sm">Selecciona una categoría y consulta los materiales por unidad.</p>
        </div>

        <!-- Mobile tabs -->
        <div id="mobile-tabs" role="tablist" aria-label="Categorías de contenido"></div>

        <!-- Two-column layout -->
        <div class="content-layout">

            <!-- Sidebar (desktop) -->
            <aside id="content-sidebar" aria-label="Categorías de contenido">
                <p class="sidebar-heading">Categorías</p>
                <ul id="type-tabs" class="type-tab-list" role="tablist"></ul>
            </aside>

            <!-- Content panel -->
            <div id="content-panel" role="tabpanel" aria-live="polite"></div>

        </div>

    </main>

    <footer class="app-footer">
        <p>&copy; 2026 Grado Superior de Robótica y Automatización Industrial</p>
        <div style="margin-top:8px;">
            <a href="faq.html">Preguntas frecuentes</a>
            <a href="mailto:testautomatizacionhelp@gmail.com">Contacto</a>
        </div>
    </footer>

    <script>
    // ── Data ────────────────────────────────────────────────────────────────
    const SUBJECT_META = {
        dt:     { name: 'Documentación Técnica' },
        ii:     { name: 'Informática Industrial' },
        sdmyr:  { name: 'Sistemas de Medida y Regulación' },
        iplei:  { name: 'Itinerario Personal para la Empleabilidad' },
        ip:     { name: 'Inglés Profesional' },
        sdp:    { name: 'Sistemas de Potencia' },
        seneh:  { name: 'Sistemas Eléctricos, Neumáticos e Hidráulicos' },
        ssp:    { name: 'Sistemas Secuenciales Programables' },
        adiple: { name: 'Ampliación de Itinerario Personal' }
    };

    const TYPE_META = [
        { key: 'temas',        label: 'Temas',        icon: '📖', labelClass: 'type-label--temas',        cardLabel: 'Tema' },
        { key: 'resumenes',    label: 'Resúmenes',    icon: '📝', labelClass: 'type-label--resumenes',    cardLabel: 'Resumen Universae' },
        { key: 'diapositivas', label: 'Diapositivas', icon: '📊', labelClass: 'type-label--diapositivas', cardLabel: 'Diapositivas' },
        { key: 'infografias',  label: 'Infografías',  icon: '🗺️', labelClass: 'type-label--infografias',  cardLabel: 'Infografía' },
        { key: 'profesor180',  label: 'Profesor 180', icon: '🎓', labelClass: 'type-label--profesor180',  cardLabel: 'Profesor 180' },
        { key: 'anexos',       label: 'Anexos',       icon: '📎', labelClass: 'type-label--anexos',       cardLabel: 'Anexo' },
        { key: 'trabajos',     label: 'Trabajos',     icon: '✏️', labelClass: 'type-label--trabajos',     cardLabel: 'Trabajo' }
    ];

    // ── Init ────────────────────────────────────────────────────────────────
    const params      = new URLSearchParams(location.search);
    const subjectCode = params.get('subject') || 'ip';
    const subjectMeta = SUBJECT_META[subjectCode];
    const subjectData = window.CONTENT_DATA ? window.CONTENT_DATA[subjectCode] : null;

    // Set titles
    if (subjectMeta) {
        document.getElementById('subject-title').textContent = subjectMeta.name;
        document.getElementById('breadcrumb-subject').textContent = subjectMeta.name;
        document.title = subjectMeta.name + ' — Contenido | ExamRobotic';
    }

    // ── Available types ─────────────────────────────────────────────────────
    function getAvailableTypes() {
        if (!subjectData) return [];
        return TYPE_META.filter(t => {
            if (t.key === 'resumenes') return true; // always (has platform PDF)
            return subjectData[t.key] && Object.keys(subjectData[t.key]).length > 0;
        });
    }

    function countPdfs(typeKey) {
        if (!subjectData) return 0;
        const td = subjectData[typeKey];
        if (!td) return 0;
        let n = 0;
        for (const k of Object.keys(td)) {
            if (k === 'platform') { n++; continue; }
            const v = td[k];
            n += Array.isArray(v) ? v.length : 1;
        }
        return n;
    }

    // ── Tab rendering ───────────────────────────────────────────────────────
    let activeType = null;

    function renderTabs() {
        const available = getAvailableTypes();
        if (!available.length) return;

        const tabList    = document.getElementById('type-tabs');
        const mobileTabs = document.getElementById('mobile-tabs');
        tabList.innerHTML    = '';
        mobileTabs.innerHTML = '';

        available.forEach(t => {
            const count = countPdfs(t.key);

            // Desktop sidebar button
            const li  = document.createElement('li');
            li.className = 'type-tab-item';
            li.setAttribute('role', 'presentation');
            const btn = document.createElement('button');
            btn.setAttribute('role', 'tab');
            btn.setAttribute('data-type', t.key);
            btn.setAttribute('aria-selected', 'false');
            btn.innerHTML = `<span class="tab-icon">${t.icon}</span><span class="tab-label">${t.label}</span><span class="tab-count">${count}</span>`;
            btn.addEventListener('click', () => selectType(t.key));
            li.appendChild(btn);
            tabList.appendChild(li);

            // Mobile pill
            const pill = document.createElement('button');
            pill.className = 'mobile-tab-pill';
            pill.setAttribute('role', 'tab');
            pill.setAttribute('data-type', t.key);
            pill.setAttribute('aria-selected', 'false');
            pill.innerHTML = `<span>${t.icon}</span><span>${t.label}</span>`;
            pill.addEventListener('click', () => selectType(t.key));
            mobileTabs.appendChild(pill);
        });

        // Auto-select first
        selectType(available[0].key);
    }

    function selectType(typeKey) {
        activeType = typeKey;

        // Update active state on all tab controls
        document.querySelectorAll('[data-type]').forEach(el => {
            const isActive = el.getAttribute('data-type') === typeKey;
            el.setAttribute('aria-selected', isActive ? 'true' : 'false');
            el.classList.toggle('tab-active', isActive);
        });

        renderPanel(typeKey);
    }

    // ── Panel rendering ─────────────────────────────────────────────────────
    function prettifyName(filename) {
        // Remove .pdf extension and decode underscores/dashes to spaces
        return filename
            .replace(/\.pdf$/i, '')
            .replace(/_/g, ' ')
            .replace(/-/g, ' - ')
            .trim();
    }

    function makePdfCard(filePath, labelClass, labelText) {
        const filename = filePath.split('/').pop();
        const a = document.createElement('a');
        a.className = 'pdf-card';
        a.href = filePath;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.innerHTML = `
            <span class="pdf-icon">📄</span>
            <span class="pdf-name" title="${prettifyName(filename)}">${prettifyName(filename)}</span>
            <span class="pdf-meta">
                <span class="type-label ${labelClass}">${labelText}</span>
                <span class="open-btn">Abrir <span class="arrow-icon">→</span></span>
            </span>`;
        return a;
    }

    function renderPanel(typeKey) {
        const panel   = document.getElementById('content-panel');
        const typeMeta = TYPE_META.find(t => t.key === typeKey);
        panel.innerHTML = '';

        if (!subjectData) {
            panel.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📂</div>
                    <div class="empty-state-title">No hay contenido disponible</div>
                    <div class="empty-state-desc">No se encontraron materiales para esta asignatura.</div>
                </div>`;
            return;
        }

        const typeData = subjectData[typeKey];

        if (typeKey === 'resumenes') {
            // ---- Resúmenes section: platform first, then Universae by unit ----

            // Platform (existing summary PDF)
            const platformPath = typeData && typeData['platform'];
            if (platformPath) {
                const group = document.createElement('div');
                group.className = 'unit-group';
                group.innerHTML = `
                    <div class="unit-heading">
                        <span class="unit-badge unit-badge--platform">Resumen Plataforma</span>
                    </div>`;
                const card = makePdfCard(platformPath, 'type-label--platform', 'Resumen Plataforma');
                // Override the card name to be more descriptive
                card.querySelector('.pdf-name').textContent = (subjectMeta ? subjectMeta.name : 'Asignatura') + ' — Resumen Completo';
                group.appendChild(card);
                panel.appendChild(group);
            }

            // Universae resumenes by unit
            if (typeData) {
                const unitKeys = Object.keys(typeData)
                    .filter(k => k !== 'platform')
                    .map(Number)
                    .sort((a, b) => a - b);

                unitKeys.forEach(unitNum => {
                    const files = typeData[unitNum];
                    const fileList = Array.isArray(files) ? files : [files];
                    const group   = document.createElement('div');
                    group.className = 'unit-group';
                    group.innerHTML = `
                        <div class="unit-heading">
                            <span class="unit-badge">Unidad ${unitNum}</span>
                            <span class="unit-title">Resumen Universae</span>
                        </div>`;
                    fileList.forEach(f => {
                        group.appendChild(makePdfCard(f, 'type-label--resumenes', 'Resumen Universae'));
                    });
                    panel.appendChild(group);
                });

                if (unitKeys.length === 0 && !platformPath) {
                    panel.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📝</div>
                            <div class="empty-state-title">Sin resúmenes disponibles</div>
                            <div class="empty-state-desc">No hay resúmenes cargados para esta asignatura.</div>
                        </div>`;
                }
            }

        } else {
            // ---- Other content types ----
            if (!typeData || Object.keys(typeData).length === 0) {
                panel.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">${typeMeta ? typeMeta.icon : '📂'}</div>
                        <div class="empty-state-title">Sin contenido disponible</div>
                        <div class="empty-state-desc">No hay ${typeMeta ? typeMeta.label.toLowerCase() : 'materiales'} cargados para esta asignatura.</div>
                    </div>`;
                return;
            }

            const unitKeys = Object.keys(typeData)
                .map(Number)
                .sort((a, b) => a - b);

            unitKeys.forEach(unitNum => {
                const files    = typeData[unitNum];
                const fileList = Array.isArray(files) ? files : [files];
                const group    = document.createElement('div');
                group.className = 'unit-group';
                group.innerHTML = `
                    <div class="unit-heading">
                        <span class="unit-badge">Unidad ${unitNum}</span>
                    </div>`;
                fileList.forEach(f => {
                    group.appendChild(makePdfCard(f, typeMeta.labelClass, typeMeta.cardLabel));
                });
                panel.appendChild(group);
            });
        }
    }

    // ── Boot ────────────────────────────────────────────────────────────────
    if (!subjectMeta) {
        document.getElementById('content-panel').innerHTML = `
            <div class="empty-state">
                <div class="empty-state-icon">🔍</div>
                <div class="empty-state-title">Asignatura no encontrada</div>
                <div class="empty-state-desc">Vuelve a la <a href="index.html" style="color:var(--primary-color);font-weight:700">página principal</a> y selecciona una asignatura.</div>
            </div>`;
    } else {
        renderTabs();
    }
    </script>

</body>
</html>

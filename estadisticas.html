<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Progreso · ExamRobotic</title>
    <meta name="description" content="Panel de estadísticas y progreso personal en ExamRobotic.">
    <link rel="icon" href="assets/img/images/logo/logorobot.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <script src="assets/js/theme.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/user-stats.js"></script>
    <link rel="stylesheet" href="assets/css/menu.css">
    <link rel="stylesheet" href="assets/css/animations.css">

    <style>
        /* ── HERO ── */
        .stats-hero {
            position: relative;
            border-radius: var(--radius-xl);
            padding: 36px;
            margin-bottom: 28px;
            overflow: hidden;
            background: var(--surface);
            border: 1px solid var(--line);
        }
        [data-theme="night"] .stats-hero,
        [data-theme="dark"] .stats-hero {
            background: linear-gradient(135deg, oklch(0.35 0.16 250 / 0.4), oklch(0.15 0.12 260 / 0.7));
            border-color: rgba(120,145,220,0.2);
            backdrop-filter: blur(20px);
        }
        .stats-hero::before {
            content: ""; position: absolute; inset: 0; opacity: 0.4; pointer-events: none;
            background:
                radial-gradient(circle at 90% 10%, var(--accent-bg), transparent 40%),
                radial-gradient(circle at 10% 110%, var(--accent-bg), transparent 50%);
        }
        [data-theme="night"] .stats-hero::before,
        [data-theme="dark"] .stats-hero::before {
            background:
                radial-gradient(circle at 85% 0%, oklch(0.5 0.20 250 / 0.5), transparent 50%),
                radial-gradient(circle at 0% 100%, oklch(0.4 0.18 280 / 0.5), transparent 50%);
        }
        .stats-hero-inner { position: relative; z-index: 1; }
        .hero-top { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
        .hero-avatar {
            width: 52px; height: 52px;
            border-radius: 14px;
            background: var(--accent);
            color: white;
            display: grid; place-items: center;
            font-family: 'Instrument Serif', serif;
            font-style: italic;
            font-size: 22px;
            flex-shrink: 0;
        }
        [data-theme="night"] .hero-avatar,
        [data-theme="dark"] .hero-avatar {
            background: linear-gradient(135deg, oklch(0.55 0.20 252), oklch(0.42 0.18 240));
            color: white;
        }
        .hero-name { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; margin-top: 4px; color: var(--ink); }
        .hero-name .em { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; color: var(--accent-ink); }
        [data-theme="night"] .hero-name .em,
        [data-theme="dark"] .hero-name .em { color: oklch(0.85 0.14 245); }

        /* KPI grid */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1px;
            background: var(--line-soft);
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--line-soft);
        }
        .kpi-cell { background: var(--surface); padding: 18px 20px; }
        [data-theme="night"] .kpi-cell,
        [data-theme="dark"] .kpi-cell { background: rgba(15,22,50,0.65); }
        .kpi-val { font-size: 30px; font-weight: 500; letter-spacing: -0.025em; line-height: 1; color: var(--ink); }
        .kpi-val .serif { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; }
        .kpi-val .unit { font-size: 14px; color: var(--muted); font-weight: 400; margin-left: 4px; }
        .kpi-lbl {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
            margin-top: 8px;
        }

        /* Layout */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

        .panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            padding: 24px;
        }
        [data-theme="night"] .panel,
        [data-theme="dark"] .panel {
            background: rgba(20,28,60,0.5);
            border-color: rgba(120,145,220,0.15);
            backdrop-filter: blur(20px);
        }
        .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; gap: 12px; flex-wrap: wrap; }
        .panel-title { font-size: 14px; font-weight: 600; letter-spacing: -0.005em; color: var(--ink); }

        /* Bars */
        .bar-row { margin-bottom: 14px; }
        .bar-row:last-child { margin-bottom: 0; }
        .bar-row-head { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
        .bar-row-lbl { font-size: 13px; font-weight: 500; color: var(--ink); }
        .bar-row-val { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
        .bar-row-track { height: 6px; background: var(--bg-2); border-radius: 999px; overflow: hidden; }
        [data-theme="night"] .bar-row-track,
        [data-theme="dark"] .bar-row-track { background: rgba(10,14,32,0.6); }
        .bar-row-fill { height: 100%; border-radius: 999px; transition: width 0.8s cubic-bezier(0.16,1,0.3,1); }
        .bar-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

        /* Activity heatmap */
        .act-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
        .act-cell {
            aspect-ratio: 1;
            border-radius: 4px;
            background: var(--bg-2);
        }
        .act-cell.active { background: var(--success); }
        [data-theme="night"] .act-cell,
        [data-theme="dark"] .act-cell { background: rgba(20,28,60,0.6); }
        [data-theme="night"] .act-cell.active,
        [data-theme="dark"] .act-cell.active {
            background: oklch(0.72 0.18 245);
            box-shadow: 0 0 10px oklch(0.65 0.20 245 / 0.6);
        }

        /* Failures */
        .fail-item {
            display: flex; align-items: flex-start; gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--line-soft);
        }
        .fail-item:last-child { border-bottom: none; }
        .fail-count {
            min-width: 36px; height: 36px;
            border-radius: 10px;
            background: var(--danger-bg);
            color: var(--danger);
            font-weight: 700;
            display: grid; place-items: center;
            font-size: 14px;
            font-family: 'JetBrains Mono', monospace;
            flex-shrink: 0;
        }
        .fail-text { font-size: 13px; font-weight: 500; line-height: 1.4; color: var(--ink); }
        .fail-meta { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--muted); margin-top: 4px; letter-spacing: 0.04em; }

        /* Topic heatmap */
        .topic-item { margin-bottom: 12px; }
        .topic-item:last-child { margin-bottom: 0; }
        .topic-hdr { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 500; margin-bottom: 4px; color: var(--ink); }
        .topic-count { color: var(--danger); font-weight: 700; font-family: 'JetBrains Mono', monospace; font-size: 11px; }
        .topic-track { height: 6px; background: var(--bg-2); border-radius: 999px; overflow: hidden; }
        [data-theme="night"] .topic-track,
        [data-theme="dark"] .topic-track { background: rgba(10,14,32,0.6); }
        .topic-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--danger), var(--warn)); }

        /* History */
        .hist-item {
            display: flex; align-items: center; gap: 14px;
            padding: 12px 0;
            border-bottom: 1px solid var(--line-soft);
        }
        .hist-item:last-child { border-bottom: none; }
        .hist-dot {
            width: 44px; height: 44px;
            border-radius: 12px;
            display: grid; place-items: center;
            font-family: 'Instrument Serif', serif;
            font-style: italic; font-weight: 400;
            font-size: 18px;
            flex-shrink: 0;
        }
        .hist-dot.pass { background: var(--success-bg); color: var(--success); }
        .hist-dot.fail { background: var(--danger-bg); color: var(--danger); }
        .hist-info { flex: 1; min-width: 0; }
        .hist-subj { font-size: 13.5px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .hist-meta {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10.5px;
            color: var(--muted);
            margin-top: 2px;
            letter-spacing: 0.04em;
        }
        .hist-score { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 3rem; text-align: right; }
        .tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
            white-space: nowrap;
        }
        .tag.pass { background: var(--success-bg); color: var(--success); }
        .tag.fail { background: var(--danger-bg); color: var(--danger); }
        .tag.neutral { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line-soft); }
        [data-theme="night"] .tag.neutral,
        [data-theme="dark"] .tag.neutral { background: rgba(20,28,60,0.5); border-color: rgba(120,145,220,0.15); }

        /* Filter & utility */
        .filter-select {
            border: 1px solid var(--line);
            background: var(--surface-2);
            color: var(--ink);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 12px;
            font-family: inherit;
            cursor: pointer;
            font-weight: 500;
        }
        [data-theme="night"] .filter-select,
        [data-theme="dark"] .filter-select { background: rgba(20,28,60,0.5); border-color: rgba(120,145,220,0.18); }

        .btn-ghost {
            background: var(--surface-2);
            border: 1px solid var(--line);
            color: var(--muted);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            font-family: inherit;
            transition: all 0.18s;
        }
        .btn-ghost:hover { border-color: var(--danger); color: var(--danger); background: var(--danger-bg); }
        [data-theme="night"] .btn-ghost,
        [data-theme="dark"] .btn-ghost { background: rgba(20,28,60,0.5); border-color: rgba(120,145,220,0.18); }

        .empty {
            text-align: center;
            padding: 36px 16px;
            color: var(--muted);
        }
        .empty-icon { font-size: 36px; margin-bottom: 12px; opacity: 0.6; }
        .empty-title { font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
        .empty-sub { font-size: 12.5px; }
    </style>
</head>
<body>

    <div class="header-inner">
        <a href="index.html" class="brand">

                <img src="assets/img/images/logo/logorobot.svg" alt="ExamRobotic">

        <nav class="header-nav">

    <div class="stats-hero">
        <div class="stats-hero-inner">
            <div class="hero-top">

                    <div class="eyebrow">Mi progreso</div>

    <!-- ROW 1: subject bars + activity -->

        </div>
        <div class="panel">

<script>
const SUBJECT_NAMES = {
    ip:    'Inglés Profesional',
    sdmyr: 'Sist. de Medida y Regulación',
    dt:    'Documentación Técnica',
    ii:    'Informática Industrial',
    seneh: 'Sist. Eléctricos, N. e H.',
    iplei: 'Itinerario Personal',
    ssp:   'Sist. Sec. Programables',
    sdp:   'Sistemas de Potencia',
    adiple:'Ampliación Itinerario',
    ipe:   'Itinerario Personal Emp.',
    libre: 'Test Libre',
    unknown:'Sin clasificar'
};

function scoreColor(s) {
    if (s >= 7) return 'var(--success)';
    if (s >= 5) return 'var(--warn)';
    return 'var(--danger)';
}

function fmtTime(sec) {
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    if (h > 0) return h + 'h ' + (m > 0 ? m + 'm' : '');
    if (m > 0) return m + 'm';
    return sec + 's';
}

function fmtDate(ts) {
    const diff = Math.floor((Date.now() - ts) / 86400000);
    if (diff === 0) return 'Hoy';
    if (diff === 1) return 'Ayer';
    if (diff < 7)  return 'Hace ' + diff + ' días';
    return new Date(ts).toLocaleDateString('es-ES', { day:'numeric', month:'short' });
}

function calcStreak(history) {
    if (!history.length) return 0;
    const days = [...new Set(history.map(h => new Date(h.date).toLocaleDateString('en-CA')))].sort().reverse();
    const today = new Date().toLocaleDateString('en-CA');
    const yesterday = new Date(Date.now() - 86400000).toLocaleDateString('en-CA');
    if (days[0] !== today && days[0] !== yesterday) return 0;
    let streak = 1;
    for (let i = 1; i < days.length; i++) {
        if ((new Date(days[i-1]) - new Date(days[i])) / 86400000 === 1) streak++;
        else break;
    }
    return streak;
}

function empty(title, sub) {
    return `<div class="empty"><div class="empty-icon">📭</div><div class="empty-title">${title}</div><div class="empty-sub">${sub}</div></div>`;
}

function render() {
    const stats    = UserStats.data;
    const subjects = stats.subjects || {};
    const failures = stats.failures || {};
    const history  = [...(stats.history || [])];

    const totalSessions = history.length;
    const allScores = Object.values(subjects).flatMap(s => s.scores || []);
    const globalAvg = allScores.length ? (allScores.reduce((a,b)=>a+b,0)/allScores.length) : null;
    const totalTime = history.reduce((s,h) => s+(h.timeSpentSec||0), 0);
    const streak    = calcStreak(history);
    const totalFailed = Object.values(failures).reduce((a,s) => a + Object.values(s).filter(q=>q.count>0).length, 0);
    const subjEntries = Object.entries(subjects).filter(([,s])=>s.avgScore!=null);
    const bestSlug  = subjEntries.sort((a,b)=>b[1].avgScore-a[1].avgScore)[0];

    document.getElementById('kpi-row').innerHTML = `
        <div class="kpi-cell">
            <div class="kpi-val">${globalAvg!=null ? globalAvg.toFixed(1).replace('.', '<span class="serif">,</span>') : '—'}</div>
            <div class="kpi-lbl">Nota media</div>
        </div>
        <div class="kpi-cell">
            <div class="kpi-val">${totalSessions}</div>
            <div class="kpi-lbl">Sesiones</div>
        </div>
        <div class="kpi-cell">
            <div class="kpi-val">${totalTime>0 ? fmtTime(totalTime) : '0m'}</div>
            <div class="kpi-lbl">Tiempo total</div>
        </div>
        <div class="kpi-cell">
            <div class="kpi-val">${streak}<span class="unit">días</span></div>
            <div class="kpi-lbl">Racha</div>
        </div>
        <div class="kpi-cell">
            <div class="kpi-val">${totalFailed}</div>
            <div class="kpi-lbl">Falladas</div>
        </div>
        <div class="kpi-cell">
            <div class="kpi-val" style="font-size:15px; padding-top:6px; font-weight:600;">${bestSlug ? SUBJECT_NAMES[bestSlug[0]] || bestSlug[0] : '—'}</div>
            <div class="kpi-lbl">Mejor asignatura</div>
        </div>
    `;

    const sorted = Object.entries(subjects).sort((a,b)=>(b[1].avgScore||0)-(a[1].avgScore||0));
    document.getElementById('subject-bars').innerHTML = sorted.length === 0
        ? empty('Sin datos todavía', 'Completa algunos tests para ver tu rendimiento.')
        : sorted.map(([slug, s]) => {
            const avg  = s.avgScore || 0;
            const best = s.scores?.length ? Math.max(...s.scores) : avg;
            const pct  = Math.min(100, avg * 10);
            const color = scoreColor(avg);
            return `<div class="bar-row">
                <div class="bar-row-head">
                    <span class="bar-row-lbl">${SUBJECT_NAMES[slug]||slug}</span>
                    <span class="bar-row-val" style="color:${color}">${avg.toFixed(1)}</span>
                </div>
                <div class="bar-row-track"><div class="bar-row-fill" style="width:${pct}%; background:${color}"></div></div>
                <div class="bar-sub">${s.totalAttempts||0} sesión(es) · mejor: ${best.toFixed(1)}</div>
            </div>`;
        }).join('');

    const actGrid  = document.getElementById('act-grid');
    const activeDays = new Set(history.map(h => new Date(h.date).toLocaleDateString('en-CA')));
    const today = new Date(); today.setHours(0,0,0,0);
    actGrid.innerHTML = '';
    for (let i = 69; i >= 0; i--) {
        const d = new Date(today); d.setDate(today.getDate() - i);
        const key = d.toLocaleDateString('en-CA');
        const cell = document.createElement('div');
        cell.className = 'act-cell' + (activeDays.has(key) ? ' active' : '');
        cell.title = key;
        actGrid.appendChild(cell);
    }

    const sel = document.getElementById('subj-filter');
    const existingSlugs = Object.keys(failures).filter(s => Object.values(failures[s]).some(q=>q.count>0));
    sel.innerHTML = '<option value="all">Todas las asignaturas</option>' +
        existingSlugs.map(s => `<option value="${s}">${SUBJECT_NAMES[s]||s}</option>`).join('');
    renderFailures();

    const topicMap = {};
    Object.values(failures).forEach(qs => {
        Object.values(qs).forEach(f => {
            if (f.count > 0 && f.unit) topicMap[f.unit] = (topicMap[f.unit]||0) + f.count;
        });
    });
    const topicEntries = Object.entries(topicMap).sort((a,b)=>b[1]-a[1]).slice(0,10);
    const maxT = topicEntries[0]?.[1] || 1;
    document.getElementById('topic-heatmap').innerHTML = topicEntries.length === 0
        ? empty('¡Sin errores acumulados!', 'Sigue practicando para ver qué temas necesitas reforzar.')
        : topicEntries.map(([unit, cnt]) => `
            <div class="topic-item">
                <div class="topic-hdr"><span>${unit}</span><span class="topic-count">${cnt} fallo${cnt!==1?'s':''}</span></div>
                <div class="topic-track"><div class="topic-fill" style="width:${(cnt/maxT*100).toFixed(0)}%"></div></div>
            </div>`).join('');

    const rev = [...history].reverse();
    document.getElementById('history-list').innerHTML = rev.length === 0
        ? empty('Sin historial', 'Completa tu primer test para registrar tu progreso aquí.')
        : rev.slice(0,25).map(h => {
            const pass = h.score >= 5;
            const name = SUBJECT_NAMES[h.subject] || h.subject || '?';
            const type = h.type === 'simulacro' ? 'Simulacro' : 'Test';
            const timeStr = h.timeSpentSec > 0 ? fmtTime(h.timeSpentSec) : '';
            return `<div class="hist-item">
                <div class="hist-dot ${pass?'pass':'fail'}">${h.score?.toFixed(1)||'—'}</div>
                <div class="hist-info">
                    <div class="hist-subj">${name}</div>
                    <div class="hist-meta">${fmtDate(h.date)}${timeStr?' · '+timeStr:''}</div>
                </div>
                <span class="tag neutral">${type}</span>
                <span class="tag ${pass?'pass':'fail'}">${pass?'Apto':'No apto'}</span>
                <div class="hist-score" style="color:${scoreColor(h.score||0)}">${h.score?.toFixed(2)||'—'}</div>
            </div>`;
        }).join('');
}

function renderFailures() {
    const filter = document.getElementById('subj-filter').value;
    const failures = UserStats.data.failures || {};
    let all = [];
    Object.entries(failures).forEach(([slug, qs]) => {
        if (filter !== 'all' && slug !== filter) return;
        Object.values(qs).forEach(f => {
            if (f.count > 0) all.push({...f, slug});
        });
    });
    all.sort((a,b) => b.count - a.count);
    document.getElementById('failures-list').innerHTML = all.length === 0
        ? empty('¡Sin fallos!', 'No hay preguntas falladas en esta selección. 🏅')
        : all.slice(0,8).map(f => `
            <div class="fail-item">
                <div class="fail-count">${f.count}</div>
                <div>
                    <div class="fail-text">${f.text}</div>
                    <div class="fail-meta">${SUBJECT_NAMES[f.slug]||f.slug} · ${f.unit}</div>
                </div>
            </div>`).join('');
}

function confirmClear() {
    if (!confirm('¿Borrar todo el historial y estadísticas? Esta acción no se puede deshacer.')) return;
    UserStats.data = { subjects:{}, failures:{}, history:[] };
    UserStats.save();
    render();
}

render();
UserStats.syncFromCloud && UserStats.syncFromCloud().then(loaded => { if (loaded) render(); });
</script>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Progreso · ExamRobotic</title>
    <meta name="description" content="Panel de estadísticas y progreso personal en ExamRobotic.">
    <link rel="icon" href="assets/img/images/logo/logorobot.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/user-stats.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg:      #f1f5f9;
            --surface: #ffffff;
            --surface2: #f8fafc;
            --border:  #e2e8f0;
            --text:    #0f172a;
            --muted:   #64748b;
            --primary: #3b82f6;
            --success: #10b981;
            --danger:  #ef4444;
            --warning: #f59e0b;
            --radius:  1.25rem;
        }
        [data-theme="dark"] {
            --bg:      #0f172a;
            --surface: #1e293b;
            --surface2: #162032;
            --border:  #334155;
            --text:    #e2e8f0;
            --muted:   #94a3b8;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        /* ── HEADER ── */
        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 50;
            transition: background 0.3s, border-color 0.3s;
        }
        .header-inner {
            max-width: 1200px; margin: 0 auto; padding: 0 1.5rem;
            height: 4.5rem; display: flex; align-items: center; justify-content: space-between;
        }
        .header-left  { display: flex; align-items: center; gap: 0.75rem; }
        .header-logo  { width: 2.5rem; height: 2.5rem; }
        .header-title { font-size: 1rem; font-weight: 800; }
        .header-sub   { font-size: 0.68rem; color: var(--primary); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
        .header-actions { display: flex; align-items: center; gap: 0.5rem; }
        .icon-btn {
            width: 2.5rem; height: 2.5rem; border-radius: 50%;
            border: 1px solid var(--border); background: var(--bg);
            color: var(--text); cursor: pointer; font-size: 1.1rem;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; text-decoration: none;
        }
        .icon-btn:hover { background: var(--border); transform: scale(1.05); }

        /* ── HERO ── */
        .hero {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 50%, #06b6d4 100%);
            padding: 2.5rem 1.5rem 3.5rem;
        }
        [data-theme="dark"] .hero {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0f172a 100%);
        }
        .hero-inner { max-width: 1200px; margin: 0 auto; }
        .hero-top { display: flex; align-items: center; gap: 1.25rem; margin-bottom: 2rem; }
        .hero-avatar {
            width: 4rem; height: 4rem; border-radius: 50%;
            background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.4);
            backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; font-weight: 900; color: white; letter-spacing: -1px;
            flex-shrink: 0;
        }
        .hero-name { font-size: 1.6rem; font-weight: 900; color: white; }
        .hero-sub  { font-size: 0.82rem; color: rgba(255,255,255,0.7); margin-top: 0.2rem; }

        /* KPI CARDS */
        .kpi-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 1rem;
        }
        .kpi {
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 1rem; padding: 1.25rem 1rem;
            text-align: center; transition: transform 0.2s;
        }
        .kpi:hover { transform: translateY(-2px); }
        .kpi-val  { font-size: 2rem; font-weight: 900; color: white; line-height: 1; }
        .kpi-lbl  { font-size: 0.68rem; color: rgba(255,255,255,0.7); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 0.4rem; }
        .kpi-icon { font-size: 1.4rem; margin-bottom: 0.3rem; }

        /* ── MAIN CONTENT ── */
        main { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

        /* ── GRID SECTIONS ── */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; margin-bottom: 1.5rem; }
        @media (max-width: 900px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }
        .col-span-2 { grid-column: span 2; }
        @media (max-width: 900px) { .col-span-2 { grid-column: span 1; } }

        /* ── CARD ── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.75rem;
            transition: background 0.3s, border-color 0.3s;
            animation: fadeUp 0.4s ease both;
        }
        @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
        .card:nth-child(1) { animation-delay: 0.05s; }
        .card:nth-child(2) { animation-delay: 0.1s; }
        .card:nth-child(3) { animation-delay: 0.15s; }
        .card-title {
            font-size: 0.75rem; font-weight: 800; text-transform: uppercase;
            letter-spacing: 0.07em; color: var(--primary); margin-bottom: 1.5rem;
            display: flex; align-items: center; justify-content: space-between;
        }

        /* ── BARS ── */
        .bar-item { margin-bottom: 1.25rem; }
        .bar-item:last-child { margin-bottom: 0; }
        .bar-hdr { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.4rem; }
        .bar-lbl { font-size: 0.85rem; font-weight: 600; }
        .bar-val { font-size: 0.85rem; font-weight: 800; }
        .bar-track { height: 10px; background: var(--bg); border-radius: 999px; overflow: hidden; }
        .bar-fill  { height: 100%; border-radius: 999px; transition: width 1s cubic-bezier(0.16,1,0.3,1); }
        .bar-sub   { font-size: 0.72rem; color: var(--muted); margin-top: 0.25rem; }

        /* ── ACTIVITY GRID ── */
        .act-grid { display: flex; flex-wrap: wrap; gap: 3px; }
        .act-cell {
            width: 13px; height: 13px; border-radius: 3px;
            background: var(--bg); transition: background 0.3s;
        }
        .act-cell.active { background: #22c55e; }
        [data-theme="dark"] .act-cell { background: #1e293b; }

        /* ── FAILURES ── */
        .fail-item {
            display: flex; align-items: flex-start; gap: 0.9rem;
            padding: 0.9rem 0; border-bottom: 1px solid var(--border);
        }
        .fail-item:last-child { border-bottom: none; padding-bottom: 0; }
        .fail-count {
            min-width: 2.25rem; height: 2.25rem; border-radius: 0.6rem;
            background: #fef2f2; color: var(--danger); font-weight: 900;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.85rem; flex-shrink: 0;
        }
        [data-theme="dark"] .fail-count { background: #450a0a; color: #fca5a5; }
        .fail-text { font-size: 0.82rem; font-weight: 600; line-height: 1.4; }
        .fail-meta { font-size: 0.72rem; color: var(--muted); margin-top: 0.15rem; }

        /* ── HISTORY ── */
        .hist-item {
            display: flex; align-items: center; gap: 1rem;
            padding: 0.85rem 0; border-bottom: 1px solid var(--border);
        }
        .hist-item:last-child { border-bottom: none; padding-bottom: 0; }
        .hist-dot {
            width: 2.5rem; height: 2.5rem; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.82rem; font-weight: 900; flex-shrink: 0;
        }
        .hist-dot.pass { background: #d1fae5; color: #059669; }
        .hist-dot.fail { background: #fee2e2; color: #dc2626; }
        [data-theme="dark"] .hist-dot.pass { background: #064e3b; color: #6ee7b7; }
        [data-theme="dark"] .hist-dot.fail { background: #450a0a; color: #fca5a5; }
        .hist-info { flex: 1; min-width: 0; }
        .hist-subj { font-size: 0.85rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .hist-date { font-size: 0.72rem; color: var(--muted); }
        .hist-score { font-size: 1.1rem; font-weight: 900; }
        .badge {
            font-size: 0.65rem; font-weight: 800; padding: 2px 7px;
            border-radius: 999px; white-space: nowrap;
        }
        .badge-pass { background: #d1fae5; color: #059669; }
        .badge-fail { background: #fee2e2; color: #dc2626; }
        .badge-type { background: #eff6ff; color: #3b82f6; }
        [data-theme="dark"] .badge-pass { background: #064e3b; color: #6ee7b7; }
        [data-theme="dark"] .badge-fail { background: #450a0a; color: #fca5a5; }
        [data-theme="dark"] .badge-type { background: #1e3a8a; color: #93c5fd; }

        /* ── TOPIC HEATMAP ── */
        .topic-item { margin-bottom: 0.9rem; }
        .topic-item:last-child { margin-bottom: 0; }
        .topic-hdr { display: flex; justify-content: space-between; font-size: 0.82rem; font-weight: 600; margin-bottom: 0.3rem; }
        .topic-count { color: var(--danger); font-weight: 800; }
        .topic-track { height: 8px; background: var(--bg); border-radius: 999px; overflow: hidden; }
        .topic-fill  { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #ef4444, #f97316); }

        /* ── SUBJECT FILTER ── */
        .filter-select {
            border: 1px solid var(--border); background: var(--bg); color: var(--text);
            border-radius: 0.5rem; padding: 0.25rem 0.5rem; font-size: 0.78rem;
            font-family: inherit; cursor: pointer; font-weight: 600;
        }

        /* ── EMPTY STATE ── */
        .empty { text-align: center; padding: 2.5rem 1rem; color: var(--muted); }
        .empty-icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
        .empty-title { font-size: 1rem; font-weight: 700; color: var(--text); margin-bottom: 0.4rem; }
        .empty-sub { font-size: 0.82rem; }

        /* ── CLEAR BTN ── */
        .btn-ghost {
            background: none; border: 1px solid var(--border); color: var(--muted);
            padding: 0.35rem 0.85rem; border-radius: 0.625rem; cursor: pointer;
            font-size: 0.75rem; font-weight: 700; transition: all 0.2s; font-family: inherit;
        }
        .btn-ghost:hover { border-color: var(--danger); color: var(--danger); background: #fef2f2; }
        [data-theme="dark"] .btn-ghost:hover { background: #450a0a; }

        /* ── SECTION HEADER ── */
        .section-hdr {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        /* ── STREAK MINI ── */
        .streak-row { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem; }
        .streak-pip { width: 8px; height: 20px; border-radius: 3px; flex-shrink: 0; }
    </style>
</head>
<body>

<header>
    <div class="header-inner">
        <div class="header-left">
            <a href="index.html">
                <img src="assets/img/images/logo/logorobot.svg" class="header-logo" alt="ExamRobotic">
            </a>
            <div>
                <div class="header-title">Mi Progreso</div>
                <div class="header-sub">Panel de Estadísticas</div>
            </div>
        </div>
        <div class="header-actions">
            <span id="sync-status" style="font-size:0.7rem;color:var(--muted);transition:color 0.3s"></span>
            <button class="icon-btn" onclick="toggleTheme()" title="Cambiar tema" id="theme-btn">
                <script>document.write(document.documentElement.getAttribute('data-theme')==='dark'?'☀️':'🌙');</script>
            </button>
            <a href="index.html" class="icon-btn" title="Inicio">🏠</a>
        </div>
    </div>
</header>

<!-- HERO -->
<div class="hero">
    <div class="hero-inner">
        <div class="hero-top">
            <div class="hero-avatar">ER</div>
            <div>
                <div class="hero-name">Mi Progreso</div>
                <div class="hero-sub">Grado Superior · Robótica y Automatización Industrial</div>
            </div>
        </div>
        <div class="kpi-row" id="kpi-row">
            <!-- injected -->
        </div>
    </div>
</div>

<main>

    <!-- ROW 1: subject bars + activity -->
    <div class="grid-2">
        <div class="card">
            <div class="card-title">📈 Nota Media por Asignatura</div>
            <div id="subject-bars"></div>
        </div>
        <div class="card">
            <div class="card-title">📅 Actividad (últimas 10 semanas)</div>
            <div class="act-grid" id="act-grid"></div>
            <p style="font-size:0.72rem;color:var(--muted);margin-top:0.75rem;">🟩 = día con actividad</p>
        </div>
    </div>

    <!-- ROW 2: failures + topic heatmap -->
    <div class="grid-2">
        <div class="card">
            <div class="section-hdr">
                <div class="card-title" style="margin-bottom:0">❌ Preguntas Más Falladas</div>
                <select class="filter-select" id="subj-filter" onchange="renderFailures()">
                    <option value="all">Todas las asignaturas</option>
                </select>
            </div>
            <div id="failures-list"></div>
        </div>
        <div class="card">
            <div class="card-title">🔥 Temas con Más Errores</div>
            <div id="topic-heatmap"></div>
        </div>
    </div>

    <!-- ROW 3: history full width -->
    <div class="card" style="animation-delay:0.2s">
        <div class="section-hdr">
            <div class="card-title" style="margin-bottom:0">🕐 Historial de Sesiones</div>
            <button class="btn-ghost" onclick="confirmClear()">Borrar Todo</button>
        </div>
        <div id="history-list"></div>
    </div>

</main>

<script>
const SUBJECT_NAMES = {
    ip:    'Inglés Profesional',
    sdmyr: 'Sist. de Medida y Regulación',
    dt:    'Documentación Técnica',
    ii:    'Informática Industrial',
    seneh: 'Sist. Eléctricos, N. e H.',
    iplei: 'Itinerario Personal',
    ssp:   'Sist. Sec. Programables',
    sdp:   'Sistemas de Potencia',
    adiple:'Ampliación Itinerario',
    ipe:   'Itinerario Personal Emp.',
    libre: 'Test Libre',
    unknown:'Sin clasificar'
};

function scoreColor(s) {
    if (s >= 7) return '#10b981';
    if (s >= 5) return '#f59e0b';
    return '#ef4444';
}

function fmtTime(sec) {
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    if (h > 0) return h + 'h ' + (m > 0 ? m + 'm' : '');
    if (m > 0) return m + 'm';
    return sec + 's';
}

function fmtDate(ts) {
    const diff = Math.floor((Date.now() - ts) / 86400000);
    if (diff === 0) return 'Hoy';
    if (diff === 1) return 'Ayer';
    if (diff < 7)  return 'Hace ' + diff + ' días';
    return new Date(ts).toLocaleDateString('es-ES', { day:'numeric', month:'short' });
}

function calcStreak(history) {
    if (!history.length) return 0;
    const days = [...new Set(history.map(h => new Date(h.date).toLocaleDateString('en-CA')))].sort().reverse();
    const today = new Date().toLocaleDateString('en-CA');
    const yesterday = new Date(Date.now() - 86400000).toLocaleDateString('en-CA');
    if (days[0] !== today && days[0] !== yesterday) return 0;
    let streak = 1;
    for (let i = 1; i < days.length; i++) {
        if ((new Date(days[i-1]) - new Date(days[i])) / 86400000 === 1) streak++;
        else break;
    }
    return streak;
}

function empty(title, sub) {
    return `<div class="empty"><div class="empty-icon">📭</div><div class="empty-title">${title}</div><div class="empty-sub">${sub}</div></div>`;
}

function render() {
    const stats    = UserStats.data;
    const subjects = stats.subjects || {};
    const failures = stats.failures || {};
    const history  = [...(stats.history || [])];

    /* ── KPIs ── */
    const totalSessions = history.length;
    const allScores = Object.values(subjects).flatMap(s => s.scores || []);
    const globalAvg = allScores.length ? (allScores.reduce((a,b)=>a+b,0)/allScores.length) : null;
    const totalTime = history.reduce((s,h) => s+(h.timeSpentSec||0), 0);
    const streak    = calcStreak(history);
    const totalFailed = Object.values(failures).reduce((a,s) => a + Object.values(s).filter(q=>q.count>0).length, 0);
    const subjEntries = Object.entries(subjects).filter(([,s])=>s.avgScore!=null);
    const bestSlug  = subjEntries.sort((a,b)=>b[1].avgScore-a[1].avgScore)[0];
    const worstSlug = subjEntries.sort((a,b)=>a[1].avgScore-b[1].avgScore)[0];

    document.getElementById('kpi-row').innerHTML = `
        <div class="kpi"><div class="kpi-icon">📚</div><div class="kpi-val">${totalSessions}</div><div class="kpi-lbl">Sesiones</div></div>
        <div class="kpi"><div class="kpi-icon">⭐</div><div class="kpi-val">${globalAvg!=null?globalAvg.toFixed(1):'—'}</div><div class="kpi-lbl">Nota media</div></div>
        <div class="kpi"><div class="kpi-icon">⏱️</div><div class="kpi-val">${totalTime>0?fmtTime(totalTime):'0m'}</div><div class="kpi-lbl">Tiempo</div></div>
        <div class="kpi"><div class="kpi-icon">🔥</div><div class="kpi-val">${streak}</div><div class="kpi-lbl">Racha días</div></div>
        <div class="kpi"><div class="kpi-icon">❌</div><div class="kpi-val">${totalFailed}</div><div class="kpi-lbl">Falladas</div></div>
        <div class="kpi"><div class="kpi-icon">🏆</div><div class="kpi-val" style="font-size:0.9rem;padding-top:0.2rem">${bestSlug?SUBJECT_NAMES[bestSlug[0]]||bestSlug[0]:'—'}</div><div class="kpi-lbl">Mejor asig.</div></div>
        <div class="kpi"><div class="kpi-icon">⚠️</div><div class="kpi-val" style="font-size:0.9rem;padding-top:0.2rem">${worstSlug?SUBJECT_NAMES[worstSlug[0]]||worstSlug[0]:'—'}</div><div class="kpi-lbl">A reforzar</div></div>
    `;

    /* ── SUBJECT BARS ── */
    const sorted = Object.entries(subjects).sort((a,b)=>(b[1].avgScore||0)-(a[1].avgScore||0));
    document.getElementById('subject-bars').innerHTML = sorted.length === 0
        ? empty('Sin datos todavía', 'Completa algunos tests para ver tu rendimiento.')
        : sorted.map(([slug, s]) => {
            const avg  = s.avgScore || 0;
            const best = s.scores?.length ? Math.max(...s.scores) : avg;
            const pct  = Math.min(100, avg * 10);
            const color = scoreColor(avg);
            return `<div class="bar-item">
                <div class="bar-hdr">
                    <span class="bar-lbl">${SUBJECT_NAMES[slug]||slug}</span>
                    <span class="bar-val" style="color:${color}">${avg.toFixed(1)}</span>
                </div>
                <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
                <div class="bar-sub">${s.totalAttempts||0} sesión(es) · mejor: ${best.toFixed(1)}</div>
            </div>`;
        }).join('');

    /* ── ACTIVITY GRID ── */
    const actGrid  = document.getElementById('act-grid');
    const activeDays = new Set(history.map(h => new Date(h.date).toLocaleDateString('en-CA')));
    const today = new Date(); today.setHours(0,0,0,0);
    actGrid.innerHTML = '';
    for (let i = 69; i >= 0; i--) {
        const d = new Date(today); d.setDate(today.getDate() - i);
        const key = d.toLocaleDateString('en-CA');
        const cell = document.createElement('div');
        cell.className = 'act-cell' + (activeDays.has(key) ? ' active' : '');
        cell.title = key;
        actGrid.appendChild(cell);
    }

    /* ── FILTER ── */
    const sel = document.getElementById('subj-filter');
    const existingSlugs = Object.keys(failures).filter(s => Object.values(failures[s]).some(q=>q.count>0));
    sel.innerHTML = '<option value="all">Todas las asignaturas</option>' +
        existingSlugs.map(s => `<option value="${s}">${SUBJECT_NAMES[s]||s}</option>`).join('');
    renderFailures();

    /* ── TOPIC HEATMAP ── */
    const topicMap = {};
    Object.values(failures).forEach(qs => {
        Object.values(qs).forEach(f => {
            if (f.count > 0 && f.unit) topicMap[f.unit] = (topicMap[f.unit]||0) + f.count;
        });
    });
    const topicEntries = Object.entries(topicMap).sort((a,b)=>b[1]-a[1]).slice(0,10);
    const maxT = topicEntries[0]?.[1] || 1;
    document.getElementById('topic-heatmap').innerHTML = topicEntries.length === 0
        ? empty('¡Sin errores acumulados!', 'Sigue practicando para ver qué temas necesitas reforzar.')
        : topicEntries.map(([unit, cnt]) => `
            <div class="topic-item">
                <div class="topic-hdr"><span>${unit}</span><span class="topic-count">${cnt} fallo${cnt!==1?'s':''}</span></div>
                <div class="topic-track"><div class="topic-fill" style="width:${(cnt/maxT*100).toFixed(0)}%"></div></div>
            </div>`).join('');

    /* ── HISTORY ── */
    const rev = [...history].reverse();
    document.getElementById('history-list').innerHTML = rev.length === 0
        ? empty('Sin historial', 'Completa tu primer test para registrar tu progreso aquí.')
        : rev.slice(0,25).map(h => {
            const pass = h.score >= 5;
            const name = SUBJECT_NAMES[h.subject] || h.subject || '?';
            const type = h.type === 'simulacro' ? 'Simulacro' : 'Test';
            const timeStr = h.timeSpentSec > 0 ? fmtTime(h.timeSpentSec) : '';
            return `<div class="hist-item">
                <div class="hist-dot ${pass?'pass':'fail'}">${h.score?.toFixed(1)||'—'}</div>
                <div class="hist-info">
                    <div class="hist-subj">${name}</div>
                    <div class="hist-date">${fmtDate(h.date)}${timeStr?' · '+timeStr:''}</div>
                </div>
                <span class="badge badge-type" style="margin-right:0.4rem">${type}</span>
                <span class="badge ${pass?'badge-pass':'badge-fail'}">${pass?'APTO':'NO APTO'}</span>
                <div class="hist-score" style="color:${scoreColor(h.score||0)};min-width:3rem;text-align:right">${h.score?.toFixed(2)||'—'}</div>
            </div>`;
        }).join('');
}

function renderFailures() {
    const filter = document.getElementById('subj-filter').value;
    const failures = UserStats.data.failures || {};
    let all = [];
    Object.entries(failures).forEach(([slug, qs]) => {
        if (filter !== 'all' && slug !== filter) return;
        Object.values(qs).forEach(f => {
            if (f.count > 0) all.push({...f, slug});
        });
    });
    all.sort((a,b) => b.count - a.count);
    document.getElementById('failures-list').innerHTML = all.length === 0
        ? empty('¡Sin fallos!', 'No hay preguntas falladas en esta selección. 🏅')
        : all.slice(0,8).map(f => `
            <div class="fail-item">
                <div class="fail-count">${f.count}</div>
                <div>
                    <div class="fail-text">${f.text}</div>
                    <div class="fail-meta">${SUBJECT_NAMES[f.slug]||f.slug} · ${f.unit}</div>
                </div>
            </div>`).join('');
}

function confirmClear() {
    if (!confirm('¿Borrar todo el historial y estadísticas? Esta acción no se puede deshacer.')) return;
    UserStats.data = { subjects:{}, failures:{}, history:[] };
    UserStats.save();
    render();
}

render();

// Intentar recuperar datos de la nube al cargar (si hay sesión activa)
UserStats.syncFromCloud().then(loaded => { if (loaded) render(); });
</script>
<script src="assets/js/analytics.js"></script>

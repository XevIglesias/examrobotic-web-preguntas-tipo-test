<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Test Libre · ExamRobotic</title>
    <meta name="description" content="Test libre multi-asignatura. Elige cuántas preguntas quieres y de qué asignaturas.">
    <link rel="icon" href="assets/img/images/logo/logorobot.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="assets/js/theme.js"></script>
    <link rel="stylesheet" href="assets/css/quiz.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; }

        /* ── SETUP SCREEN ── */
        #free-setup {
            position: fixed; inset: 0; background: rgba(15,23,42,0.92);
            backdrop-filter: blur(12px); z-index: 9999;
            display: flex; align-items: center; justify-content: center; padding: 1rem;
        }
        .fs-modal {
            background: var(--er-bg, #fff); width: 100%; max-width: 640px;
            border-radius: 2rem; padding: 2.5rem;
            box-shadow: 0 30px 60px -12px rgba(0,0,0,0.6);
            animation: modalIn 0.4s cubic-bezier(0.16,1,0.3,1);
            max-height: 90vh; overflow-y: auto;
        }
        [data-theme="dark"] .fs-modal {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            box-shadow: 0 0 0 1px #334155, 0 30px 60px -12px rgba(0,0,0,0.8);
        }
        @keyframes modalIn { from { opacity:0; transform:scale(0.9) translateY(20px); } }
        .fs-back {
            position: absolute; top: 1.25rem; right: 1.25rem;
            width: 2.2rem; height: 2.2rem; border-radius: 50%;
            background: #f1f5f9; border: none; color: #64748b;
            cursor: pointer; font-size: 1rem; display: flex;
            align-items: center; justify-content: center; transition: all 0.2s; z-index: 5;
        }
        [data-theme="dark"] .fs-back { background: #334155; color: #e2e8f0; }
        .fs-back:hover { transform: rotate(90deg); }
        .fs-modal { position: relative; }
        .fs-heading { font-size: 1.75rem; font-weight: 900; margin-bottom: 0.4rem; }
        [data-theme="dark"] .fs-heading { color: #e2e8f0; }
        .fs-sub { color: #64748b; font-size: 0.9rem; margin-bottom: 2rem; }
        [data-theme="dark"] .fs-sub { color: #94a3b8; }
        .fs-section-label {
            font-size: 0.78rem; font-weight: 800; text-transform: uppercase;
            letter-spacing: 0.06em; color: #3b82f6; margin-bottom: 1rem;
            display: flex; align-items: center; gap: 0.75rem;
        }
        [data-theme="dark"] .fs-section-label { color: #60a5fa; }
        .fs-section { margin-bottom: 2rem; }

        /* Subject Chips */
        .subj-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
        .subj-chip-check { display: none; }
        .subj-chip-label {
            display: flex; align-items: center; gap: 0.6rem; padding: 0.75rem 1rem;
            background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 0.875rem;
            cursor: pointer; font-size: 0.83rem; font-weight: 600; color: #334155;
            transition: all 0.2s; user-select: none;
        }
        [data-theme="dark"] .subj-chip-label { background: #1e293b; border-color: #334155; color: #e2e8f0; }
        .subj-chip-check:checked + .subj-chip-label {
            background: #eff6ff; border-color: #3b82f6; color: #1d4ed8;
        }
        [data-theme="dark"] .subj-chip-check:checked + .subj-chip-label {
            background: #1e3a8a; border-color: #3b82f6; color: #93c5fd;
        }
        .subj-chip-dot {
            width: 1.25rem; height: 1.25rem; border-radius: 50%;
            border: 2px solid #cbd5e1; background: white; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; font-size: 0.6rem;
            transition: all 0.2s;
        }
        [data-theme="dark"] .subj-chip-dot { background: #0f172a; border-color: #475569; }
        .subj-chip-check:checked + .subj-chip-label .subj-chip-dot {
            background: #3b82f6; border-color: #3b82f6; color: white;
        }
        .subj-chip-check:checked + .subj-chip-label .subj-chip-dot::after { content: "✓"; }

        /* Quantity Buttons */
        .qty-row { display: flex; gap: 0.75rem; }
        .qty-btn {
            flex: 1; padding: 1.1rem; border-radius: 1rem; border: 1.5px solid #e2e8f0;
            background: #f8fafc; font-weight: 800; font-size: 1rem; color: #64748b;
            cursor: pointer; transition: all 0.2s; font-family: inherit;
        }
        [data-theme="dark"] .qty-btn { background: #1e293b; border-color: #334155; color: #94a3b8; }
        .qty-btn.active { background: #3b82f6; border-color: #3b82f6; color: white; transform: translateY(-2px); box-shadow: 0 6px 16px rgba(59,130,246,0.35); }
        .qty-btn .qty-sub { font-size: 0.68rem; font-weight: 600; opacity: 0.75; display: block; margin-top: 0.2rem; }

        /* Correction toggle */
        .correction-row {
            display: flex; align-items: center; gap: 1rem; padding: 1rem 1.25rem;
            background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 1rem;
            cursor: pointer; transition: all 0.2s;
        }
        [data-theme="dark"] .correction-row { background: #1e293b; border-color: #334155; }
        .correction-row.on { background: #eff6ff; border-color: #3b82f6; }
        [data-theme="dark"] .correction-row.on { background: #1e3a8a; border-color: #3b82f6; }
        #corr-check { display: none; }
        .corr-circle {
            width: 1.5rem; height: 1.5rem; border-radius: 50%; border: 2px solid #cbd5e1;
            background: white; display: flex; align-items: center; justify-content: center;
            font-size: 0.7rem; color: transparent; transition: all 0.2s; flex-shrink: 0;
        }
        [data-theme="dark"] .corr-circle { background: #0f172a; border-color: #475569; }
        .correction-row.on .corr-circle { background: #3b82f6; border-color: #3b82f6; color: white; }
        .corr-text-main { font-weight: 800; font-size: 0.9rem; }
        [data-theme="dark"] .corr-text-main { color: #e2e8f0; }
        .corr-text-sub { font-size: 0.75rem; color: #64748b; }
        [data-theme="dark"] .corr-text-sub { color: #94a3b8; }

        .fs-start-btn {
            width: 100%; padding: 1.25rem; border-radius: 1.25rem; border: none;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white;
            font-size: 1.1rem; font-weight: 800; cursor: pointer; transition: all 0.3s;
            box-shadow: 0 10px 20px -5px rgba(59,130,246,0.4); margin-top: 0.5rem; font-family: inherit;
        }
        .fs-start-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 30px -5px rgba(59,130,246,0.5); }
        .fs-start-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .fs-toggle-row { display: flex; gap: 0.75rem; margin-bottom: 1rem; }
        .fs-toggle-btn {
            flex: 1; padding: 0.5rem; border: 1px solid #e2e8f0; border-radius: 0.5rem;
            background: #f8fafc; font-size: 0.75rem; font-weight: 700; color: #64748b;
            cursor: pointer; font-family: inherit; transition: all 0.2s;
        }
        [data-theme="dark"] .fs-toggle-btn { background: #1e293b; border-color: #334155; color: #94a3b8; }
        .fs-toggle-btn:hover { border-color: #3b82f6; color: #3b82f6; }

        #loading-overlay {
            position: fixed; inset: 0; background: var(--er-bg, #fff);
            display: none; align-items: center; justify-content: center;
            flex-direction: column; gap: 1rem; z-index: 9998; font-family: 'Inter', sans-serif;
        }
        [data-theme="dark"] #loading-overlay { background: #0f172a; }
        .spinner {
            width: 3rem; height: 3rem; border: 4px solid #e2e8f0;
            border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        [data-theme="dark"] .spinner { border-color: #334155; border-top-color: #3b82f6; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-weight: 700; color: #64748b; font-size: 0.9rem; }
        [data-theme="dark"] .loading-text { color: #94a3b8; }
    </style>
</head>
<body>

<!-- Loading overlay -->
<div id="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Cargando preguntas...</div>
</div>

<!-- SETUP SCREEN -->
<div id="free-setup">
    <div class="fs-modal">
        <a href="index.html" class="fs-back" title="Volver">✕</a>
        <div class="fs-heading">🎯 Test Libre</div>
        <p class="fs-sub">Mezcla preguntas de todas las asignaturas que quieras en un solo examen.</p>

        <div class="fs-section">
            <div class="fs-section-label">
                <span>1. Asignaturas</span>
                <button class="fs-toggle-btn" onclick="toggleAll(true)">Todas</button>
                <button class="fs-toggle-btn" onclick="toggleAll(false)">Ninguna</button>
            </div>
            <div class="subj-grid" id="subj-grid">
                <!-- Injected -->
            </div>
        </div>

        <div class="fs-section">
            <div class="fs-section-label">2. Número de Preguntas</div>
            <div class="qty-row">
                <button class="qty-btn" id="qty-10" onclick="setQty(10)">10<span class="qty-sub">Repaso rápido</span></button>
                <button class="qty-btn active" id="qty-40" onclick="setQty(40)">40<span class="qty-sub">Examen oficial</span></button>
                <button class="qty-btn" id="qty-all" onclick="setQty('all')">Todas<span class="qty-sub" id="qty-all-count"></span></button>
            </div>
        </div>

        <div class="fs-section">
            <div class="fs-section-label">3. Modo Corrección</div>
            <label class="correction-row" id="corr-row" onclick="toggleCorr()">
                <div class="corr-circle" id="corr-circle">✓</div>
                <div>
                    <div class="corr-text-main">⚡ Corrección Instantánea</div>
                    <div class="corr-text-sub">Comprueba cada respuesta antes de continuar</div>
                </div>
            </label>
        </div>

        <button class="fs-start-btn" id="fs-start-btn" onclick="launchTest()">EMPEZAR TEST</button>
    </div>
</div>

<!-- QUIZ AREA (same structure as simulacro) -->
<header style="display:none" id="quiz-header">
    <div>
        <h2 id="exam-title" style="font-size: 1.2rem;">Test Libre</h2>
        <p id="q-progress" style="font-size: 0.8rem; color: #64748b;">Preparando...</p>
    </div>
    <div class="timer-box" id="timer">
        <span>⏳</span> <span id="time-val">00:00</span>
    </div>
</header>

<div id="quiz" style="display:none;">
    <div class="q-card">
        <div id="q-unit" class="q-meta">TEST LIBRE</div>
        <div id="q-text" class="q-text">Cargando...</div>
        <div id="options-area" style="display:grid; gap:10px;"></div>
        <div id="explanation" class="exp-box"></div>
    </div>
    <div class="nav-footer">
        <button class="btn" style="background:#e2e8f0; color:#333;" onclick="move(-1)">Anterior</button>
        <button class="btn btn-next" id="btn-next" onclick="move(1)">Siguiente</button>
        <button class="btn btn-finish" id="btn-finish" style="display:none" onclick="finish()">Finalizar</button>
        <button class="btn" id="btn-menu-review" style="display:none; background:var(--primary);color:white;" onclick="location.reload()">Nuevo Test</button>
    </div>
    <div class="dot-grid" id="dot-grid"></div>
</div>

<div id="results" style="display:none;">
    <p style="font-weight:800;color:var(--accent);letter-spacing:2px;">NOTA FINAL</p>
    <div class="score-badge" id="res-score">0.0</div>
    <div class="score-sub" id="res-msg">Resultado</div>
    <div style="display:flex;gap:15px;justify-content:center;margin-top:40px;flex-wrap:wrap;">
        <button class="btn btn-next" style="max-width:220px;background:var(--accent);" onclick="showReview()">Revisar Errores</button>
        <button class="btn" style="max-width:220px;background:#e2e8f0;color:#333;" onclick="location.reload()">Nuevo Test</button>
        <button class="btn" style="max-width:220px;background:var(--primary);color:white;" onclick="window.location.href='index.html'">Inicio</button>
    </div>
</div>

<script src="assets/js/user-stats.js"></script>
<script src="assets/js/api.js" defer></script>
<script>
// ── CONFIG ──
const SUBJECTS = [
    { slug:'ip',    name:'Inglés Profesional',           emoji:'🇬🇧' },
    { slug:'sdmyr', name:'Sistemas de Medida',            emoji:'📏' },
    { slug:'dt',    name:'Documentación Técnica',         emoji:'📄' },
    { slug:'ii',    name:'Informática Industrial',        emoji:'💻' },
    { slug:'seneh', name:'Sist. Eléctricos, N. e H.',    emoji:'⚡' },
    { slug:'iplei', name:'Itinerario Personal',           emoji:'🎯' },
    { slug:'ssp',   name:'Sist. Sec. Programables',      emoji:'🤖' },
    { slug:'sdp',   name:'Sistemas de Potencia',         emoji:'⚙️' },
    { slug:'adiple',name:'Ampliación Itinerario',        emoji:'📚' },
];

let selectedQty = 40;
let corrInstant = false;
let loadedData = {};   // slug -> array of questions
let allPool = [];

// ── BUILD SUBJECT GRID ──
document.getElementById('subj-grid').innerHTML = SUBJECTS.map(s => `
    <div>
        <input type="checkbox" class="subj-chip-check" id="cb-${s.slug}" value="${s.slug}" checked onchange="updateAllCount()">
        <label for="cb-${s.slug}" class="subj-chip-label">
            <div class="subj-chip-dot"></div>
            <span>${s.emoji} ${s.name}</span>
        </label>
    </div>`).join('');

updateAllCount();

function toggleAll(val) {
    document.querySelectorAll('.subj-chip-check').forEach(cb => cb.checked = val);
    updateAllCount();
}

function updateAllCount() {
    const checked = Array.from(document.querySelectorAll('.subj-chip-check:checked')).map(c=>c.value);
    // We can't know exact count without loading, so show placeholder
    document.getElementById('qty-all-count').textContent = checked.length + ' asig.';
}

function setQty(n) {
    selectedQty = n;
    document.querySelectorAll('.qty-btn').forEach(b => b.classList.remove('active'));
    if (n === 10) document.getElementById('qty-10').classList.add('active');
    else if (n === 40) document.getElementById('qty-40').classList.add('active');
    else document.getElementById('qty-all').classList.add('active');
}

function toggleCorr() {
    corrInstant = !corrInstant;
    document.getElementById('corr-row').classList.toggle('on', corrInstant);
}

// ── LOAD DATA DYNAMICALLY ──
async function loadSubjectData(slug) {
    if (loadedData[slug]) return loadedData[slug];
    return new Promise((resolve) => {
        const script = document.createElement('script');
        script.src = `data/${slug}/simulacro.js?_=${Date.now()}`;
        script.onload = () => {
            // After load, EXAM_DATA or SIMULACRO_PDF_DATA is defined globally
            const data = (typeof SIMULACRO_PDF_DATA !== 'undefined' ? SIMULACRO_PDF_DATA : [])
                .concat(typeof EXAM_DATA !== 'undefined' ? EXAM_DATA : []);
            // Tag each question with subject slug
            const tagged = data.map(q => ({ ...q, _subj: slug }));
            loadedData[slug] = tagged;
            // Reset globals for next load
            window.SIMULACRO_PDF_DATA = undefined;
            window.EXAM_DATA = undefined;
            resolve(tagged);
        };
        script.onerror = () => resolve([]);
        document.head.appendChild(script);
    });
}

async function launchTest() {
    const checked = Array.from(document.querySelectorAll('.subj-chip-check:checked')).map(c=>c.value);
    if (checked.length === 0) { alert('Selecciona al menos una asignatura.'); return; }

    document.getElementById('loading-overlay').style.display = 'flex';

    // Load all selected subjects
    const promises = checked.map(slug => loadSubjectData(slug));
    const results = await Promise.all(promises);
    allPool = results.flat();

    // Deduplicate
    const seen = new Set();
    allPool = allPool.filter(q => {
        const key = (q.q + (q.opts||[]).join('')).trim().toLowerCase();
        if (seen.has(key)) return false;
        seen.add(key); return true;
    });

    if (allPool.length === 0) {
        alert('No se pudieron cargar preguntas. Inténtalo de nuevo.');
        document.getElementById('loading-overlay').style.display = 'none';
        return;
    }

    // Shuffle pool
    allPool.sort(() => Math.random() - 0.5);

    const count = selectedQty === 'all' ? allPool.length : Math.min(selectedQty, allPool.length);

    // Set globals for engine
    window.SIMULACRO_PDF_DATA = allPool;
    window.EXAM_DATA = undefined;
    window._freeTestInstantCorr = corrInstant;
    window._freeTestCount = count;
    window._skipSetup = true;

    // Hide setup, show quiz header
    document.getElementById('free-setup').style.display = 'none';
    document.getElementById('loading-overlay').style.display = 'none';
    document.getElementById('quiz-header').style.display = '';

    // Trigger engine (it's waiting for data via interval)
}
</script>

<script>
// ── SIMULACRO ENGINE PATCH ──
// We patch initSimulacro to read our flag
window.addEventListener('load', () => {
    if (!window._freeTestReady) return;
    // Handled by the engine below
});
</script>

<script src="assets/js/simulacro-engine.js" defer></script>
<script>
// Patch instantCorrection after engine loads
document.addEventListener('DOMContentLoaded', () => {
    // Listen for when quiz starts
    const origStart = window.startFromSetup;
});
</script>
<script src="assets/js/analytics.js"></script>
</body>
</html>
